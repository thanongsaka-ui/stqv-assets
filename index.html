<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QC Station</title>
<meta name="theme-color" content="#FACC15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QC Station">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- STQV-PWA-001 · Rev A · 2026-11-16 · Thanongsak (with Claude) · wrapper for the Apps Script web app (no data stored here) -->
<style>
  html, body { margin: 0; height: 100%; background: #FDE047; overflow: hidden; font-family: system-ui, "Prompt", sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #EEF2F6; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #FDE047; color: #1E293B; transition: opacity .3s; z-index: 2; text-align: center; padding: 24px; }
  #splash img { width: 160px; height: 160px; border-radius: 36px; box-shadow: 10px 10px 24px rgba(146,120,0,.35), -8px -8px 20px rgba(255,255,255,.7); }
  #splash h1 { margin: 0; font-size: 34px; }
  #msg { font-size: 22px; font-weight: 700; min-height: 1.4em; }
  .btn { display: none; padding: 18px 34px; border: 0; border-radius: 20px; background: #1E293B; color: #fff; font: inherit; font-size: 24px; font-weight: 800; }
  .dots::after { content: ''; animation: d 1.2s steps(4) infinite; }
  @keyframes d { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-512.png" alt="">
  <h1>QC Station</h1>
  <div id="msg" class="dots">กำลังเปิดระบบ</div>
  <button type="button" class="btn" id="btnOpen">เปิดระบบ</button>
  <button type="button" class="btn" id="btnRetry">ลองใหม่</button>
</div>
<iframe id="app" title="QC Station" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // Apps Script production deployment (/exec). Change here if the deployment id changes.
  const EXEC = 'https://script.google.com/macros/s/AKfycbxiJj7K6W_UPcTbbIf6G4bAF4kLJYcmc89jtr9sDGT0GzT2_drZih34u-enrxReUCJzaQ/exec';
  const q = new URLSearchParams(location.search);
  if (q.get('device')) localStorage.setItem('STQV_DEVICE', q.get('device').toUpperCase());   // remembered per tablet
  const dev = localStorage.getItem('STQV_DEVICE') || '';
  const url = EXEC + (dev ? '?device=' + encodeURIComponent(dev) : '');
  const $ = id => document.getElementById(id), splash = $('splash'), msg = $('msg');
  let ready = false;
  function show(text, btn) { msg.classList.remove('dots'); msg.textContent = text; $('btnOpen').style.display = btn === 'open' ? 'block' : 'none'; $('btnRetry').style.display = btn === 'retry' ? 'block' : 'none'; }
  $('btnOpen').onclick = () => location.href = url;      // fallback: open the app directly (needed if Google sign-in cannot run inside the frame)
  $('btnRetry').onclick = () => location.reload();
  window.addEventListener('message', e => {               // tablet.html posts {stqv:'ready'} when it has loaded
    if (e.data && e.data.stqv === 'ready') { ready = true; splash.style.opacity = '0'; setTimeout(() => splash.remove(), 300); }
  });
  if (!navigator.onLine) show('ไม่มีอินเทอร์เน็ต — ตรวจ Wi-Fi แล้วกดลองใหม่', 'retry');
  else {
    $('app').src = url;
    setTimeout(() => { if (!ready) show('เปิดในกรอบไม่ได้ (อาจต้องลงชื่อเข้าใช้ Google) — กดเพื่อเปิดระบบ', 'open'); }, 15000);
  }
  window.addEventListener('online', () => { if (!ready) location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
